# Packs, signs and releases the extension, then shows the Shelf PR to open.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: niduslabs-dev/shelf/actions/publish@87daf667348fe6ae39ca2fa8fc7cba6c3466e456
        with:
          path: .
          signing-key: ${{ secrets.SHELF_SIGNING_KEY }}
